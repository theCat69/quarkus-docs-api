app.cache.dir=.cache

# GitHub API base URLs - overridden in test profile to point to WireMock
app.github.api-base=https://api.github.com/repos/quarkusio/quarkus/contents/
app.github.zip-base=https://github.com/quarkusio/quarkus/archive/refs/heads/

# Cache refresh interval (default 6 hours)
app.refresh.interval=6h

keywords.file.minimal.score=2

# Test profile: point GitHub URLs at WireMock dev service
%test.app.cache.dir=build/test-cache
%test.app.github.api-base=http://localhost:${quarkus.wiremock.devservices.port}/repos/quarkusio/quarkus/contents/
%test.app.github.zip-base=http://localhost:${quarkus.wiremock.devservices.port}/archive/refs/heads/

# Disable scheduled jobs in test profile
%test.quarkus.scheduler.enabled=false

%test.keywords.file.minimal.score=1
