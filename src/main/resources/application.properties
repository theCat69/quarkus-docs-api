app.cache.dir=.cache

# SQLite datasource
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:.cache/index.db
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=5

# GitHub API base URLs - overridden in test profile to point to WireMock
quarkus.rest-client.github-api-client.url=https://api.github.com/repos
quarkus.rest-client.github-api-client.scope=jakarta.inject.Singleton
quarkus.rest-client.github-repository-client.url=https://github.com
quarkus.rest-client.github-repository-client.follow-redirects=true
quarkus.rest-client.github-repository-client.scope=jakarta.inject.Singleton

# GitHub repository coordinates
app.github.owner=quarkusio
app.github.repo=quarkusio.github.io
app.github.branch=main

# Default versions to cache (non-profile)
app.versions=main

# Cache refresh interval (default 6 hours)
app.refresh.interval=6h

# Document parse cache (in-memory, lazy population)
app.document-cache.enabled=true

# Batch document retrieval
app.batch.max-size=10

# Quarkiverse documentation ingestion
app.quarkiverse.enabled=true
app.quarkiverse.playbook-repo=quarkiverse/quarkiverse-docs
app.quarkiverse.playbook-branch=main
app.quarkiverse.download-concurrency=4

search.index.min-keyword-score=2
search.boost.annotation-boost=10
search.boost.annotation-packages=io.quarkus,jakarta,org.eclipse.microprofile,javax

# Related documents configuration
search.related.default-limit=5
search.related.max-limit=20
search.related.min-similarity=0.05
search.related.max-shared-keywords=10

# Subject derivation configuration
app.subjects.enabled=true
app.subjects.case-insensitive=true

# Subject patterns (regex) - evaluated in order, first match wins
app.subjects.patterns[0].pattern=.*/(getting-started|quickstart|tutorial).*
app.subjects.patterns[0].subject=getting-started
app.subjects.patterns[1].pattern=.*/cdi.*|.*/lifecycle.*|.*/config(uration)?.*
app.subjects.patterns[1].subject=core-concepts
app.subjects.patterns[2].pattern=.*/rest.*|.*/resteasy.*|.*/json.*|.*/jaxrs.*
app.subjects.patterns[2].subject=rest-apis
app.subjects.patterns[3].pattern=.*/hibernate.*|.*/panache.*|.*/datasource.*|.*/database.*|.*/jpa.*|.*/jdbc.*
app.subjects.patterns[3].subject=data-persistence
app.subjects.patterns[4].pattern=.*/security.*|.*/auth.*|.*/oidc.*|.*/jwt.*|.*/oauth.*|.*/keycloak.*
app.subjects.patterns[4].subject=security
app.subjects.patterns[5].pattern=.*/kafka.*|.*/amqp.*|.*/messaging.*|.*/reactive-messaging.*
app.subjects.patterns[5].subject=messaging
app.subjects.patterns[6].pattern=.*/kubernetes.*|.*/openshift.*|.*/docker.*|.*/container.*|.*/cloud.*
app.subjects.patterns[6].subject=cloud
app.subjects.patterns[7].pattern=.*/metrics.*|.*/health.*|.*/tracing.*|.*/logging.*|.*/opentelemetry.*|.*/micrometer.*
app.subjects.patterns[7].subject=observability
app.subjects.patterns[8].pattern=.*/test.*|.*/mock.*|.*/junit.*
app.subjects.patterns[8].subject=testing
app.subjects.patterns[9].pattern=.*/cli.*|.*/dev-services.*|.*/ide.*|.*/maven.*|.*/gradle.*
app.subjects.patterns[9].subject=tooling
app.subjects.patterns[10].pattern=.*/extension.*|.*/quarkiverse.*
app.subjects.patterns[10].subject=extensions

#%dev.app.cache-warmup.full-reset=true
%dev.quarkus.rest-client.github-api-client.logging.scope=all
%dev.quarkus.rest-client.github-api-client.logging.body-limit=500
%dev.quarkus.rest-client.github-repository-client.logging.scope=all
%dev.quarkus.rest-client.github-repository-client.logging.body-limit=500
%dev.quarkus.wiremock.devservices.enabled=false
%dev.app.versions=3.20,3.27,main

# Test profile: point GitHub URLs at WireMock dev service
%test.app.cache.dir=build/test-cache
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:build/test-cache/index.db
%test.quarkus.rest-client.github-api-client.url=http://localhost:${quarkus.wiremock.devservices.port}/repos
%test.quarkus.rest-client.github-repository-client.url=http://localhost:${quarkus.wiremock.devservices.port}

# Disable scheduled jobs in test profile
%test.quarkus.scheduler.enabled=false
%test.search.index.min-keyword-score=1
%test.app.quarkiverse.enabled=false
%test.app.document-cache.enabled=true
